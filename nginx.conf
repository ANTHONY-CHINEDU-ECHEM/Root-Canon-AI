server {
  listen 80;
  root /usr/share/nginx/html;
  location / { try_files $uri /index.html; }
  location /v1/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_buffering off;            # required for server sent events
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
  }
  location /health { proxy_pass http://api:8000; }
  location /ready { proxy_pass http://api:8000; }
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy no-referrer;
  add_header X-Frame-Options DENY;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:";
}
