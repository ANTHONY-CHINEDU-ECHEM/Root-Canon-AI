[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "root-canon-ai"
version = "2.0.0"
description = "Evidence grounded clinical decision support for UK dental surgery, built on retrieval augmented generation."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Anthony Chinedu Echem" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sse-starlette>=2.1",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "httpx>=0.27",
  "tenacity>=8.5",
  "lxml>=5.2",
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
models = ["sentence-transformers>=3.0"]
vector = ["qdrant-client>=1.10"]
cache = ["redis>=5.0"]
llm = ["anthropic>=0.40", "openai>=1.40"]
all = ["root-canon-ai[models,vector,cache,llm]"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[project.scripts]
root-canon = "backend.app.cli:main"
root-canon-ingest = "ingestion.cli:main"
root-canon-eval = "evaluation.run_eval:main"

[tool.hatch.build.targets.wheel]
packages = ["backend", "ingestion", "evaluation"]

[tool.hatch.build.targets.wheel.force-include]
"backend/app/clinical/uk_dental_formulary.yaml" = "backend/app/clinical/uk_dental_formulary.yaml"
"backend/app/knowledge" = "backend/app/knowledge"
"ingestion/config" = "ingestion/config"
"evaluation/golden_set.jsonl" = "evaluation/golden_set.jsonl"
"evaluation/thresholds.yaml" = "evaluation/thresholds.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["backend", "ingestion", "evaluation"]
omit = [
  "backend/app/llm/anthropic_provider.py",
  "backend/app/llm/openai_provider.py",
  "ingestion/sources/*.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend", "demo", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = [
  "S101",   # assert is idiomatic in tests
  "S311",   # random is not used for security
  "RUF001", # clinical text legitimately contains unicode
  "RUF002",
  "RUF003",
  "B008",   # FastAPI Depends in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501"]
"scripts/*" = ["S", "E501"]
# Curated clinical text and patterns read best unwrapped.
"ingestion/seed.py" = ["E501"]
"backend/app/guardrails/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
packages = ["backend", "ingestion", "evaluation"]
